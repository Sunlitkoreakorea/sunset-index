<!doctype html>
<html lang="ko">
<head>

  <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">

<body>

    <h1>노을 지수</h1>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>

</html>
